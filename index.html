<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>weather app</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <div class="card">
    <div class="search">
      <input type="tex" class=""placeholder="enter city name" spellcheck="false">
      <button type=""><img src="/imge/search.png"></button>
    </div>
    <div class="error">
      <p>Invalid city name</p>
    </div>
    <div class="weather">
      <img src="/imge/rain.png" alt="" class="weather-icon">
      <h1 class="temp">32°c</h1>
      <h2 class="city">Noida</h2>
      <div class="details">
        <div class="col">
          <img src="/imge/humidity.png" alt="">
          <div>
 <p class="humidity">50%</p>
        <p>Humidity</p>
          </div>
        </div>
        
     <!--2ndcolmn-->
        <div class="col">
          <img src="/imge/wind.png" alt="">
          <div>
 <p class="wind">15 km/h</p>
        <p>Wind speed</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="javascript.js"></script>
</html>
